<div class="row navbar">
  <div class="col-6">
    {% if site.github_username != "" %}<a class="fa fa-github" href="https://github.com/{{ site.github_username }}" title="GitHub"></a>{% endif %}
    {% if site.linkedin_username != "" %}<a class="fa fa-linkedin" href="https://www.linkedin.com/in/{{ site.linkedin_username }}" title="LinkedIn"></a>{% endif %}
    {% if site.facebook_username != "" %}<a class="fa fa-facebook" href="https://www.facebook.com/{{ site.facebook_username }}" title="Facebook"></a>{% endif %}
  </div>
  <div class="col-6 text-right">
    <a class="fa fa-home" href="/" title="Home"></a>
  </div>
</div>
